{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="page-title"><h1>修改密码（{{ current_user.username }}）</h1></div>
{% if must_change %}
<div class="msg warn" style="max-width:520px">
  <b>首次登录（或管理员重置口令后），必须先修改密码才能继续使用系统。</b>
</div>
{% endif %}
{% if msg %}<div class="msg ok">{{ msg }}</div>{% endif %}
<form method="post" action="/my/password" class="card" style="max-width:420px">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf }}">
  <p><label class="f" style="display:flex;flex-direction:column;align-items:flex-start;gap:.2rem">原密码（当前登录用的密码）
    <input type="password" name="old_password" required style="width:100%"></label></p>
  <p><label class="f" style="display:flex;flex-direction:column;align-items:flex-start;gap:.2rem">新密码（至少6位）
    <input type="password" name="new_password" required style="width:100%"></label></p>
  <button class="btn" type="submit">{% if must_change %}保存并进入系统{% else %}保存新密码{% endif %}</button>
</form>
{% endblock %}
