{% extends "base.html" %}
{% block title %}{{ t('修改密码') }}{% endblock %}
{% block content %}
<div class="page-title"><h1>{{ t('修改密码') }}（{{ current_user.username }}）</h1></div>
{% if must_change %}
<div class="msg warn" style="max-width:520px">
  <b>{{ t('首次登录（或管理员重置口令后），必须先修改密码才能继续使用系统。') }}</b>
</div>
{% endif %}
{% if msg %}<div class="msg ok">{{ t(msg) }}</div>{% endif %}
<form method="post" action="/my/password" class="card" style="max-width:420px">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf }}">
  <p><label class="f" style="display:flex;flex-direction:column;align-items:flex-start;gap:.2rem">{{ t('原密码（当前登录用的密码）') }}
    <input type="password" name="old_password" required style="width:100%"></label></p>
  <p><label class="f" style="display:flex;flex-direction:column;align-items:flex-start;gap:.2rem">{{ t('新密码（至少6位）') }}
    <input type="password" name="new_password" required style="width:100%"></label></p>
  <button class="btn" type="submit">{% if must_change %}{{ t('保存并进入系统') }}{% else %}{{ t('保存新密码') }}{% endif %}</button>
</form>
{% endblock %}
