<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title"><title id="title">出勤時と退勤時に打刻</title><style>text{font-family:"Hiragino Sans GB","Hiragino Kaku Gothic ProN","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="960" height="760" rx="0" fill="#f4f6fa" stroke="none" stroke-width="2"/><text x="48" y="73" font-size="44" fill="#263449" font-weight="650" text-anchor="start">出勤時と退勤時に打刻</text><text x="48" y="121" font-size="29" fill="#536279" font-weight="500" text-anchor="start">操作イメージ・実際の画面に従ってください</text><rect x="48" y="158" width="864" height="410" rx="18" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="88" y="219" font-size="38" fill="#263449" font-weight="650" text-anchor="start">出退勤記録</text><text x="88" y="267" font-size="30" fill="#536279" font-weight="500" text-anchor="start">今日・日本時間05:00に日付切替</text><path d="M88,298 L872,298" stroke="#dce2ea" stroke-width="3" fill="none"/><text x="278" y="352" font-size="32" fill="#536279" font-weight="500" text-anchor="middle">出勤</text><text x="682" y="352" font-size="32" fill="#536279" font-weight="500" text-anchor="middle">退勤</text><text x="278" y="410" font-size="52" fill="#263449" font-weight="600" text-anchor="middle">--:--</text><text x="682" y="410" font-size="52" fill="#263449" font-weight="600" text-anchor="middle">--:--</text><rect x="88" y="445" width="376" height="88" rx="14" fill="#2f5bea" stroke="#2f5bea" stroke-width="2"/><text x="276" y="502" font-size="38" fill="white" font-weight="600" text-anchor="middle">出勤打刻</text><rect x="496" y="445" width="376" height="88" rx="14" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="684" y="502" font-size="38" fill="#263449" font-weight="600" text-anchor="middle">退勤打刻</text><circle cx="108" cy="450" r="25" fill="#2f5bea"/><text x="108" y="462" font-size="34" fill="white" font-weight="650" text-anchor="middle">1</text><circle cx="516" cy="450" r="25" fill="#2f5bea"/><text x="516" y="462" font-size="34" fill="white" font-weight="650" text-anchor="middle">2</text><text x="480" y="630" font-size="34" fill="#263449" font-weight="550" text-anchor="middle">位置取得を許可 → 送信 → 当日の履歴を確認</text><text x="480" y="694" font-size="32" fill="#536279" font-weight="500" text-anchor="middle">位置取得後は自動で記録されます</text></svg>