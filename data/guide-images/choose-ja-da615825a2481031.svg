<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title"><title id="title">タスクを選び、店舗を確認</title><style>text{font-family:"Hiragino Sans GB","Hiragino Kaku Gothic ProN","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="960" height="760" rx="0" fill="#f4f6fa" stroke="none" stroke-width="2"/><text x="48" y="73" font-size="44" fill="#263449" font-weight="650" text-anchor="start">タスクを選び、店舗を確認</text><text x="48" y="121" font-size="29" fill="#536279" font-weight="500" text-anchor="start">操作イメージ・実際の画面に従ってください</text><rect x="48" y="164" width="240" height="88" rx="18" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="168" y="221" font-size="35" fill="#263449" font-weight="600" text-anchor="middle">バッチ</text><rect x="360" y="164" width="240" height="88" rx="18" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="480" y="221" font-size="35" fill="#263449" font-weight="600" text-anchor="middle">エリア</text><rect x="672" y="164" width="240" height="88" rx="18" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="792" y="221" font-size="35" fill="#263449" font-weight="600" text-anchor="middle">グリッド詳細</text><path d="M302,208 h40 m-12,-12 l12,12 -12,12" fill="none" stroke="#536279" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M614,208 h40 m-12,-12 l12,12 -12,12" fill="none" stroke="#536279" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="284" width="864" height="340" rx="18" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="88" y="348" font-size="34" fill="#536279" font-weight="500" text-anchor="start">巡回状態</text><rect x="520" y="308" width="352" height="66" rx="10" fill="#f4f6fa" stroke="#dce2ea" stroke-width="2"/><text x="696" y="353" font-size="34" fill="#263449" font-weight="550" text-anchor="middle">未実施</text><path d="M88,400 L872,400" stroke="#dce2ea" stroke-width="3" fill="none"/><rect x="76" y="424" width="808" height="120" rx="12" fill="#edf2ff" stroke="#b5c7fb" stroke-width="2"/><circle cx="114" cy="466" r="25" fill="#2f5bea"/><text x="114" y="478" font-size="34" fill="white" font-weight="650" text-anchor="middle">1</text><text x="158" y="473" font-size="38" fill="#263449" font-weight="600" text-anchor="start">サンプル店舗 A</text><text x="158" y="518" font-size="31" fill="#536279" font-weight="500" text-anchor="start">店名と住所を確認して選択</text><text x="844" y="490" font-size="54" fill="#2f5bea" font-weight="600" text-anchor="middle">›</text><text x="88" y="591" font-size="36" fill="#536279" font-weight="500" text-anchor="start">サンプル店舗 B</text><text x="480" y="688" font-size="33" fill="#263449" font-weight="550" text-anchor="middle">地図・店舗一覧・名前／住所／番号で検索</text></svg>