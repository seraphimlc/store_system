<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title"><title id="title">到店核实，保存后再离开</title><style>text{font-family:"Hiragino Sans GB","Hiragino Kaku Gothic ProN","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="960" height="760" rx="0" fill="#f4f6fa" stroke="none" stroke-width="2"/><text x="48" y="73" font-size="44" fill="#263449" font-weight="650" text-anchor="start">到店核实，保存后再离开</text><text x="48" y="121" font-size="29" fill="#536279" font-weight="500" text-anchor="start">操作示意图 · 请以当前页面为准</text><rect x="48" y="156" width="864" height="426" rx="18" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="88" y="215" font-size="35" fill="#263449" font-weight="650" text-anchor="start">门店状态</text><rect x="88" y="240" width="180" height="68" rx="12" fill="#edf2ff" stroke="#2f5bea" stroke-width="2"/><text x="178" y="286" font-size="34" fill="#2f5bea" font-weight="550" text-anchor="middle">营业</text><rect x="286" y="240" width="180" height="68" rx="12" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="376" y="286" font-size="34" fill="#263449" font-weight="550" text-anchor="middle">异常</text><rect x="484" y="240" width="180" height="68" rx="12" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="574" y="286" font-size="34" fill="#263449" font-weight="550" text-anchor="middle">不确定</text><rect x="682" y="240" width="180" height="68" rx="12" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="772" y="286" font-size="34" fill="#263449" font-weight="550" text-anchor="middle">关闭</text><text x="88" y="367" font-size="35" fill="#263449" font-weight="650" text-anchor="start">作业结果</text><rect x="88" y="392" width="244" height="68" rx="12" fill="#edf2ff" stroke="#2f5bea" stroke-width="2"/><text x="210" y="438" font-size="34" fill="#2f5bea" font-weight="550" text-anchor="middle">完成</text><rect x="354" y="392" width="244" height="68" rx="12" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="476" y="438" font-size="34" fill="#263449" font-weight="550" text-anchor="middle">待定</text><rect x="620" y="392" width="244" height="68" rx="12" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/><text x="742" y="438" font-size="34" fill="#263449" font-weight="550" text-anchor="middle">未完成</text><rect x="88" y="490" width="88" height="64" rx="8" fill="#f4f6fa" stroke="#dce2ea" stroke-width="2"/><path d="M102,540 l18,-18 13,10 18,-22 13,30 Z" fill="#b7c5d7"/><text x="198" y="519" font-size="34" fill="#263449" font-weight="500" text-anchor="start">上传门店照片</text><text x="198" y="558" font-size="30" fill="#536279" font-weight="500" text-anchor="start">最多 3 张，每张不超过 5MB</text><rect x="48" y="606" width="864" height="88" rx="14" fill="#2f5bea" stroke="#2f5bea" stroke-width="2"/><text x="480" y="663" font-size="38" fill="white" font-weight="600" text-anchor="middle">保存</text><text x="480" y="737" font-size="32" fill="#263449" font-weight="550" text-anchor="middle">确认「巡店记录已保存」，再切换下一家</text></svg>