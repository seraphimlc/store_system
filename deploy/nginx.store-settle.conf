# store.visitworld.me（新服务器，证书自旧机迁移）
server {
    server_name store.visitworld.me;

    # ── 压缩（2026-10-06"方案 A"）：原来**完全没开** → 每个页面裸传 ~120KB JS/CSS
    #    `gzip_proxied any` 是关键：本站全部是反代响应，默认 off 时不会压缩。
    #    ⚠️ `gzip_types` 里**故意不含** `text/event-stream`：/mcp 的 SSE 一压缩就被
    #       缓冲卡死（另见 /mcp 里的 `gzip off` 兜底）。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # MCP 服务（streamable HTTP）：SSE 需关缓冲 + 长超时 + HTTP/1.1
    location /mcp {
        proxy_pass http://127.0.0.1:3661;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;              # SSE 流绝不能被压缩缓冲
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 60m;
    }

    # OAuth（SSO）：发现端点与授权/换 token 由 web 提供
    # 注意：/.well-known/acme-challenge/ 前缀更长 → 证书续期仍走它，不受影响
    location /.well-known/ {
        proxy_pass http://127.0.0.1:3660;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /oauth/ {
        proxy_pass http://127.0.0.1:3660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 静态资源（本地化自托管的 JS/CSS，见 app/static/）：
    # - 模板里带 `?v={{ static_ver(...) }}`（文件 mtime+size）→ 文件一改版本号就变
    #   ⇒ 可以放心给 1 年长缓存，**永远不用手工刷缓存**
    # - 原来既没压缩也没缓存头：浏览器只能启发式缓存，每个页面都重新拉 ~120KB
    location /static/ {
        proxy_pass http://127.0.0.1:3660;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:3660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/store.visitworld.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.visitworld.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = store.visitworld.me) { return 301 https://$host$request_uri; }
    listen 80;
    server_name store.visitworld.me;
    return 404;
}
